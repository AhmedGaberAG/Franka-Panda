# Controller configuration for the Panda ros2_control system.
#
# Joint names assume the default (empty) prefix.  Regenerate or override this
# file when using panda.urdf.xacro with prefix:=<something>.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda_hand_controller:
      type: position_controllers/GripperActionController


panda_arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # Gazebo reports measured joint state. Use it for trajectory feedback so
    # MoveIt cannot report success while the robot is still behind the command.
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 8.0
      panda_joint1:
        goal: 0.02
      panda_joint2:
        goal: 0.02
      panda_joint3:
        goal: 0.02
      panda_joint4:
        goal: 0.02
      panda_joint5:
        goal: 0.02
      panda_joint6:
        goal: 0.02
      panda_joint7:
        goal: 0.02


panda_hand_controller:
  ros__parameters:
    # finger_joint2 is a mimic of finger_joint1 and is not commanded directly.
    joint: panda_finger_joint1
    max_effort: 30.0
    allow_stalling: true
    stall_timeout: 1.0
    stall_velocity_threshold: 0.001
    goal_tolerance: 0.001
